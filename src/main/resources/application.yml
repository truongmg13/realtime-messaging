spring:
  datasource:
    url: jdbc:h2:mem:messagingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  websocket:
    port: 8081
    thread-pool-size: 100
    auth-timeout: 10000       # 10 seconds to send AUTH after connecting
  jwt:
    secret: 1ZiyEkotDrIcq5q11m85Civ1CnwnB4SWpcm9PoNfFbU=
    expiration-ms: 900000     # 15 mins to expire

logging:
  level:
    root: INFO