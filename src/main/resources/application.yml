spring:
  datasource:
    url: jdbc:h2:mem:messagingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # Multipart upload limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  websocket:
    port: 8081
    thread-pool-size: 100
    auth-timeout: 30000       # 10 seconds to send AUTH after connecting
  jwt:
    # Generate with: openssl rand -based64 32
    secret: ${JWT_SECRET:1ZiyEkotDrIcq5q11m85Civ1CnwnB4SWpcm9PoNfFbU\=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}      # 15 mins to expire
  attachment:
    upload-dir: ./uploads
    max-file-size-bytes: 10485760   # 10 MB

logging:
  level:
    root: INFO